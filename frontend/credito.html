<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finanças 2026 — Crédito</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>
        <div class="content">
            <header class="page-header">
                <h1>Crédito</h1>
                <p>Controle de parcelas no cartão. Uma compra vira uma linha aqui + N parcelas geradas automaticamente.</p>
            </header>

            <main>
                <div class="card">
                    <h2>Nova compra no cartão</h2>
                    <p class="msg hint">Cartão ou categoria novos? Cadastre em <a href="cadastros.html" style="color:inherit; text-decoration:underline">Cadastros</a> antes de lançar.</p>
                    <form id="credito-form" class="stack">
                        <div>
                            <label for="descricao">Descrição</label>
                            <input type="text" id="descricao" required>
                        </div>
                        <div class="row">
                            <div>
                                <label for="cartao">Cartão</label>
                                <select id="cartao" required></select>
                            </div>
                            <div>
                                <label for="categoria">Categoria</label>
                                <select id="categoria" required></select>
                            </div>
                        </div>
                        <div class="row">
                            <div>
                                <label for="data_compra">Data da compra</label>
                                <input type="date" id="data_compra" required>
                            </div>
                            <div>
                                <label for="data_primeiro_vencimento">Vencimento da 1ª parcela</label>
                                <input type="date" id="data_primeiro_vencimento" required>
                            </div>
                        </div>
                        <div class="row">
                            <div>
                                <label for="total_parcelas">Quantidade de parcelas</label>
                                <input type="number" id="total_parcelas" min="1" value="1" required>
                            </div>
                            <div>
                                <label for="valor_parcela">Valor de cada parcela (R$)</label>
                                <input type="number" id="valor_parcela" step="0.01" required>
                            </div>
                        </div>
                        <button type="submit">Lançar compra</button>
                        <div id="msg" class="msg"></div>
                    </form>
                </div>

                <div class="card">
                    <h2>Compras</h2>
                    <form id="filtro-form" class="row" style="align-items:flex-end; flex-wrap:wrap; margin-bottom:16px">
                        <div style="flex:2; min-width:200px">
                            <label for="f-busca">Buscar na descrição</label>
                            <input type="text" id="f-busca" placeholder="ex: notebook, presente...">
                        </div>
                        <div>
                            <label for="f-cartao">Cartão</label>
                            <select id="f-cartao"><option value="">Todos</option></select>
                        </div>
                        <div>
                            <label for="f-categoria">Categoria</label>
                            <select id="f-categoria"><option value="">Todas</option></select>
                        </div>
                        <div>
                            <label for="f-data-de">Compra de</label>
                            <input type="date" id="f-data-de">
                        </div>
                        <div>
                            <label for="f-data-ate">até</label>
                            <input type="date" id="f-data-ate">
                        </div>
                        <div>
                            <button type="submit">Filtrar</button>
                        </div>
                        <div>
                            <button type="button" class="secondary" id="f-limpar">Limpar</button>
                        </div>
                    </form>
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>Descrição</th>
                                    <th>Cartão</th>
                                    <th>Categoria</th>
                                    <th class="num">Parcela</th>
                                    <th class="num">Valor total</th>
                                    <th class="num">Pagas</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                    <div id="rows-info" class="msg" style="margin-top:10px"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/common.js"></script>
    <script src="js/credito.js"></script>
</body>
</html>
