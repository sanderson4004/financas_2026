<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){var t=localStorage.getItem("tema");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
    <title>Finanças 2026 — Painel de Metas</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>
        <div class="content">
            <header class="page-header">
                <h1>Painel de Metas Fixas</h1>
                <p>Receitas, reserva e despesas com meta mensal — Fluxo + Crédito somados por categoria.</p>
            </header>

            <main>
                <div class="card">
                    <h2>Mês em foco</h2>
                    <div class="row" style="display:flex; gap:12px; align-items:flex-end; max-width:460px">
                        <div>
                            <label for="mes-sel">Mês</label>
                            <select id="mes-sel" data-no-search="true"></select>
                        </div>
                        <div>
                            <label for="ano-sel">Ano</label>
                            <select id="ano-sel" data-no-search="true"></select>
                        </div>
                        <button type="button" id="btn-mes-atual" class="secondary">Mês atual</button>
                    </div>
                </div>

                <div class="card">
                    <h2 class="top-label" style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-dim); margin-bottom: 16px;">Resumo do Mês</h2>
                    <div class="summary-grid" id="summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;"></div>
                </div>

                <div class="card" style="background: transparent; border: none; box-shadow: none; padding: 0;">
                    <div class="table-scroll">
                        <table class="table-list">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Categoria</th>
                                    <th>Caráter</th>
                                    <th class="num">Meta</th>
                                    <th class="num">Realizado</th>
                                    <th class="num">Diferença</th>
                                    <th>Status</th>
                                    <th>Fonte</th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/common.js"></script>
    <script src="js/painel.js"></script>
</body>
</html>
