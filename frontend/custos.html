<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){var t=localStorage.getItem("tema");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
    <title>Finanças 2026 — Custos Variáveis</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>
        <div class="content">
            <header class="page-header">
                <h1>Custos Variáveis</h1>
                <p>Categorias com teto anual ou meta delimitada no tempo — mês em foco independente do Painel de Metas.</p>
            </header>

            <main>
                <div class="card">
                    <h2>Mês em foco</h2>
                    <div class="filter-bar">
                        <div>
                            <label for="mes-sel">Mês</label>
                            <select class="input-pulsar" id="mes-sel" data-no-search="true"></select>
                        </div>
                        <div>
                            <label for="ano-sel">Ano</label>
                            <select class="input-pulsar" id="ano-sel" data-no-search="true"></select>
                        </div>
                        <button type="button" id="btn-mes-atual" class="btn-pulsar secondary">Mês atual</button>
                    </div>
                </div>

                <div class="card">
                    <h2>Categorias</h2>
                    <div class="table-scroll">
                        <table class="table-list">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Categoria</th>
                                    <th>Tipo</th>
                                    <th class="num">Teto</th>
                                    <th class="num">Realizado</th>
                                    <th class="num">Saldo</th>
                                    <th class="num">% usado</th>
                                    <th>Referência</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                    <div id="custo-detalhe-container"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/common.js"></script>
    <script src="js/custos.js"></script>
</body>
</html>
