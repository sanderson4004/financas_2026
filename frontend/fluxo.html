<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finanças 2026 — Fluxo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>
        <div class="content">
            <header class="page-header">
                <h1>Fluxo</h1>
                <p>Pix, dinheiro, débito e transferências. Compra de cartão de crédito vai na aba Crédito.</p>
            </header>

            <main>
                <div class="card">
                    <h2>Novo lançamento</h2>
                    <form id="fluxo-form" class="stack">
                        <div class="row">
                            <div>
                                <label for="carater">Caráter</label>
                                <select id="carater" required>
                                    <option value="RECEITA">Receita</option>
                                    <option value="DESPESA" selected>Despesa</option>
                                    <option value="TRANSFERÊNCIA">Transferência</option>
                                </select>
                            </div>
                            <div>
                                <label for="valor">Valor (R$)</label>
                                <input type="number" id="valor" step="0.01" required placeholder="ex: 150.00 ou -150.00">
                            </div>
                        </div>
                        <div class="row">
                            <div>
                                <label for="data_movimento">Data do movimento</label>
                                <input type="date" id="data_movimento" required>
                            </div>
                            <div>
                                <label for="data_pagamento">Data de pagamento (se diferente)</label>
                                <input type="date" id="data_pagamento">
                            </div>
                        </div>
                        <div class="row">
                            <div>
                                <label for="metodo">Método</label>
                                <select id="metodo" required>
                                    <option value="Pix">Pix</option>
                                    <option value="Dinheiro">Dinheiro</option>
                                    <option value="CC – Nubank">CC – Nubank</option>
                                    <option value="CC - Itaú">CC - Itaú</option>
                                    <option value="CC - VISA MP">CC - VISA MP</option>
                                </select>
                            </div>
                            <div>
                                <label for="categoria">Categoria</label>
                                <select id="categoria" required></select>
                            </div>
                        </div>
                        <div>
                            <label for="descricao">Descrição</label>
                            <input type="text" id="descricao">
                        </div>
                        <button type="submit">Lançar</button>
                        <div id="msg" class="msg"></div>
                    </form>
                </div>

                <div class="card">
                    <h2>Últimos lançamentos</h2>
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Caráter</th>
                                    <th>Categoria</th>
                                    <th>Método</th>
                                    <th>Descrição</th>
                                    <th class="num">Valor</th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/common.js"></script>
    <script src="js/fluxo.js"></script>
</body>
</html>
