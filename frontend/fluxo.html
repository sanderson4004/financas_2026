<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){var t=localStorage.getItem("tema");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
    <title>Finanças 2026 — Fluxo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>
        <div class="content">
            <header class="page-header">
                <h1>Fluxo</h1>
                <p>Pix, dinheiro, débito e transferências. Compra de cartão de crédito vai na aba Crédito.</p>
            </header>

            <main>
                <div class="card">
                    <h2>Saldo em caixa</h2>
                    <div class="summary-grid" id="saldo-metodos"></div>
                </div>

                <div class="card">
                    <h2>Novo lançamento</h2>
                    <p class="msg hint">Método ou categoria novos? Cadastre em <a href="cadastros.html" style="color:inherit; text-decoration:underline">Cadastros</a> antes de lançar.</p>
                    <form id="fluxo-form" class="stack">
                        <div class="row">
                            <div>
                                <label for="carater">Caráter</label>
                                <select id="carater" required>
                                    <option value="RECEITA">Receita</option>
                                    <option value="DESPESA" selected>Despesa</option>
                                    <option value="TRANSFERÊNCIA">Transferência</option>
                                </select>
                            </div>
                            <div>
                                <label for="valor">Valor (R$)</label>
                                <input type="number" id="valor" step="0.01" min="0.01" required placeholder="ex: 150.00">
                                <div class="msg" id="valor-dica" style="margin-top:6px"></div>
                            </div>
                        </div>
                        <div class="row">
                            <div>
                                <label for="data_movimento">Data do movimento</label>
                                <input type="date" id="data_movimento" required>
                            </div>
                            <div>
                                <label for="data_pagamento">Data de pagamento (se diferente)</label>
                                <input type="date" id="data_pagamento">
                            </div>
                        </div>
                        <div class="row">
                            <div>
                                <label for="metodo">Método</label>
                                <select id="metodo" required></select>
                            </div>
                            <div>
                                <label for="categoria">Categoria</label>
                                <select id="categoria" required></select>
                            </div>
                        </div>
                        <div>
                            <label for="descricao">Descrição</label>
                            <input type="text" id="descricao">
                        </div>
                        <button type="submit">Lançar</button>
                        <div id="msg" class="msg" aria-live="polite"></div>
                    </form>
                </div>

                <div class="card">
                    <h2>Lançamentos</h2>
                    <form id="filtro-form" class="form-filtros" style="margin-bottom:16px">
                        <div class="busca">
                            <label for="f-busca">Buscar na descrição</label>
                            <input type="text" id="f-busca" placeholder="ex: mercado, uber...">
                        </div>
                        <div>
                            <label for="f-carater">Caráter</label>
                            <select id="f-carater">
                                <option value="">Todos</option>
                                <option value="RECEITA">Receita</option>
                                <option value="DESPESA">Despesa</option>
                                <option value="TRANSFERÊNCIA">Transferência</option>
                            </select>
                        </div>
                        <div>
                            <label for="f-categoria">Categoria</label>
                            <select id="f-categoria"><option value="">Todas</option></select>
                        </div>
                        <div>
                            <label for="f-metodo">Método</label>
                            <select id="f-metodo"><option value="">Todos</option></select>
                        </div>
                        <div>
                            <label for="f-data-de">De</label>
                            <input type="date" id="f-data-de">
                        </div>
                        <div>
                            <label for="f-data-ate">Até</label>
                            <input type="date" id="f-data-ate">
                        </div>
                        <div class="acoes">
                            <button type="submit">Filtrar</button>
                            <button type="button" class="secondary" id="f-limpar">Limpar</button>
                        </div>
                    </form>
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Caráter</th>
                                    <th>Categoria</th>
                                    <th>Método</th>
                                    <th>Descrição</th>
                                    <th class="num">Valor</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                    <div id="rows-info" class="msg" style="margin-top:10px" aria-live="polite"></div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/common.js"></script>
    <script src="js/fluxo.js"></script>
</body>
</html>
